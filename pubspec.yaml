name: ntelauncher
description: "NTE PT-BR Launcher"
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  dio: 5.9.2
  http: 1.6.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  file_picker: ^11.0.2
  window_manager: 0.5.1
  path_provider: 2.1.5
  path: 1.9.1
  url_launcher: 6.3.2
  package_info_plus: 8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/certificates/cacert.pem
